jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Rules gate: if any agreed rule has stopped working, stop before posting anything.
      - name: Check the compliance rules still work
        run: node selftest.js
      - run: node contact-compliance.js
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          LEAD_STAGE_INPUT: ${{ inputs.lead_stage }}
          LIMIT_INPUT: ${{ inputs.limit }}
          CONSULTANTS_INPUT: "${{ inputs.consultant_1 }}|${{ inputs.consultant_2 }}|${{ inputs.consultant_3 }}|${{ inputs.consultant_4 }}"
