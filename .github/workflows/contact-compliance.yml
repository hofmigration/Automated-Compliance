name: Contact Compliance

on:
  schedule:
    # 05:00 UTC = 10:00 AM PKT. Scheduled runs use the fallbacks in config.js
    # (safe dry run, all consultants, all stages, no limit).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (safe test, writes nothing)?"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      lead_stage:
        description: "Lead stage to audit"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "USA NIW"
          - "Qualified CAN"
          - "Qualified AUS"
          - "Sale"
          - "Visit Visa"
          - "Germany Opportunity Card"
          - "Qualified Spain"
          - "No Answer"
          - "They Didn't Fill"
          - "Call Back"
          - "Wrong Number"
          - "Ineligible"
          - "Occupation Not Listed"
          - "Cannot Dial"
          - "Outside GCC"
          - "Switched off"
          - "Portugal D2/D8"
          - "Already Migrated"
          - "Duplicate"
          - "Started With Competitor"
          - "Work Permit"
      limit:
        description: "How many contacts to audit"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "25"
          - "50"
          - "100"
          - "250"
          - "500"
          - "1000"
